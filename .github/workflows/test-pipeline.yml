name: Automated Testing Pipeline

on:
  push:
    branches: [ main, dev_aluengas98 ]
  pull_request:
    branches: [ main, dev_aluengas98 ]

jobs:
  run-tests:
    name: Run Unit and Integration Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        run: |
          echo "Running automated unit and integration tests..."
          # If tests directory exists, execute pytest with minimum 80% coverage threshold
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=app --cov-fail-under=80
          else
            echo "Smoke test: Validating codebase syntax and Python parsing..."
            python -m compileall .
          fi

      - name: Security Vulnerability Scan (Bandit / Safety)
        run: |
          pip install bandit
          echo "Scanning codebase for security vulnerabilities..."
          bandit -r docs/ -s B101 || true
