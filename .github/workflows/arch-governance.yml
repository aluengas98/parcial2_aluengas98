name: Architecture Governance Verification

on:
  push:
    branches: [ main, dev_aluengas98 ]
  pull_request:
    branches: [ main, dev_aluengas98 ]

jobs:
  verify-architecture-rules:
    name: Verify Architectural Rules & Constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Architecture Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 import-linter pytest

      - name: Rule 1 - Verify Hexagonal Isolation (Domain Purity)
        run: |
          echo "Verifying that Domain does not import Infrastructure or Frameworks..."
          # Scan domain files for forbidden imports
          python -c "
          import os, sys, re
          forbidden = ['sqlalchemy', 'fastapi', 'starlette', 'asyncpg', 'redis', 'requests', 'httpx']
          domain_dir = 'app/domain'
          errors = 0
          if os.path.exists(domain_dir):
              for root, _, files in os.walk(domain_dir):
                  for file in files:
                      if file.endswith('.py'):
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8') as f:
                              for i, line in enumerate(f, 1):
                                  for pkg in forbidden:
                                      if re.search(r'\bimport\s+' + pkg + r'\b|\bfrom\s+' + pkg + r'\b', line):
                                          print(f'ERROR: Forbidden import of {pkg} in {path}:{i}')
                                          errors += 1
          if errors > 0:
              print(f'Architecture rule violation: {errors} forbidden imports found in domain.')
              sys.exit(1)
          print('Rule 1 passed: Domain purity is respected.')
          "

      - name: Rule 2 - Verify Prohibition of Direct Legacy Sync in Domain/Application
        run: |
          echo "Verifying that synchronous legacy calls are forbidden in domain/application..."
          python -c "
          import os, sys, re
          app_dir = 'app/application'
          errors = 0
          if os.path.exists(app_dir):
              for root, _, files in os.walk(app_dir):
                  for file in files:
                      if file.endswith('.py'):
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              if 'LegacyHttpClient' in content and 'transactional_outbox' not in content:
                                  print(f'ERROR: Direct synchronous legacy client used without Outbox in {path}')
                                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('Rule 2 passed: Outbox pattern respected.')
          "

      - name: Rule 3 - Verify ADR Documentation Integrity
        run: |
          echo "Verifying that all ADR files contain required sections..."
          python -c "
          import os, sys
          adr_dir = 'docs/actividad3'
          required = ['Identificador', 'Contexto', 'Alternativas', 'Decisión', 'Consecuencias']
          if os.path.exists(adr_dir):
              for f in os.listdir(adr_dir):
                  if f.startswith('ADR-') and f.endswith('.md'):
                      path = os.path.join(adr_dir, f)
                      with open(path, 'r', encoding='utf-8') as adr:
                          txt = adr.read()
                          for req in required:
                              if req.lower() not in txt.lower():
                                  print(f'ERROR: Missing required section \"{req}\" in {f}')
                                  sys.exit(1)
          print('Rule 3 passed: All ADRs comply with institutional standards.')
          "
